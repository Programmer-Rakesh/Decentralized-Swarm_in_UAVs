
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
    <style>
      .heading { font: bold 27px Arial, sans-serif; fill: #e5e7eb; }
      .boxTitle { font: bold 20px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .boxText { font: 16px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .label { font: 16px Arial, sans-serif; fill: #e5e7eb; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #cbd5e1; text-anchor: middle; }
      .line { fill: none; stroke: #94a3b8; stroke-width: 2.5; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #60a5fa; stroke-width: 2.5; marker-end: url(#blueArrow); }
    </style>
  </defs>

  <rect width="1100" height="850" rx="16" fill="#0d1117"/>

  <text x="550" y="48" class="heading" text-anchor="middle">UAV Swarm Simulation Pipeline</text>
  <line x1="80" y1="68" x2="1020" y2="68" stroke="#30363d" stroke-width="2"/>

  <!-- Operator -->
  <rect x="350" y="95" width="400" height="66" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="122" class="boxTitle">1. User Command</text>
  <text x="550" y="145" class="boxText">Select UAVs and configure the mission</text>

  <path d="M550 161 V194" class="line"/>

  <!-- GCS -->
  <rect x="300" y="198" width="500" height="78" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="229" class="boxTitle">2. Ground Control Station (GCS)</text>
  <text x="550" y="253" class="boxText">Formation · Spacing · Altitude · Speed · Route</text>

  <path d="M550 276 V312" class="blueLine"/>
  <rect x="570" y="283" width="205" height="25" rx="5" fill="#1f2937"/>
  <text x="672" y="301" class="label">Mission data · UDP</text>

  <!-- Swarm Agents -->
  <rect x="300" y="316" width="500" height="92" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="550" y="348" class="boxTitle">3. Swarm Agents</text>
  <text x="550" y="373" class="boxText">Coordination · Formation control · Flight commands</text>
  <text x="550" y="394" class="boxText">Exchange peer data over UDP</text>

  <!-- Peer communication side annotation -->
  <path d="M800 348 H865 V377 H800" class="line"/>
  <text x="930" y="341" class="label">Peer communication</text>
  <text x="930" y="362" class="small">UDP</text>

  <path d="M550 408 V455" class="blueLine"/>
  <rect x="570" y="416" width="245" height="27" rx="5" fill="#1f2937"/>
  <text x="692" y="435" class="label">MAVLink · Pymavlink</text>

  <!-- SITL -->
  <rect x="300" y="459" width="500" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="490" class="boxTitle">4. ArduPilot SITL</text>
  <text x="550" y="514" class="boxText">Autopilot software and vehicle control</text>

  <path d="M550 537 V584" class="line"/>
  <rect x="575" y="546" width="225" height="27" rx="5" fill="#1f2937"/>
  <text x="687" y="565" class="label">SITL–Gazebo integration</text>

  <!-- Gazebo -->
  <rect x="300" y="588" width="500" height="78" rx="12" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="550" y="619" class="boxTitle">5. Gazebo Simulator</text>
  <text x="550" y="643" class="boxText">Physics · Simulated environment · Vehicle movement</text>

  <!-- Feedback -->
  <path d="M800 626 H900 V498 H800" class="line"/>
  <rect x="817" y="536" width="210" height="49" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="922" y="556" class="label">Simulated state</text>
  <text x="922" y="575" class="small">to ArduPilot SITL</text>

  <path d="M300 497 H220 V362 H300" class="line"/>
  <rect x="78" y="405" width="190" height="58" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="173" y="428" class="label">Vehicle telemetry</text>
  <text x="173" y="449" class="small">MAVLink to agent</text>

  <!-- Status feedback -->
  <path d="M300 376 H155 V237 H300" class="line"/>
  <rect x="45" y="282" width="200" height="58" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="145" y="305" class="label">Status reports</text>
  <text x="145" y="326" class="small">UDP to GCS</text>

  <!-- Direct GCS-SITL path -->
  <path d="M800 237 H1020 V498 H800" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blueArrow)"/>
  <rect x="835" y="400" width="215" height="63" rx="7" fill="#161b22" stroke="#3b82f6"/>
  <text x="942" y="423" class="label">Direct GCS–SITL link</text>
  <text x="942" y="444" class="small">MAVLink telemetry / commands</text>

  <!-- Footer -->
  <line x1="80" y1="710" x2="1020" y2="710" stroke="#30363d" stroke-width="2"/>
  <text x="550" y="746" class="heading" text-anchor="middle" style="font-size:21px">Communication Overview</text>
  <text x="550" y="779" class="small">GCS ↔ Agents: UDP  |  Agent ↔ Agent: UDP</text>
  <text x="550" y="803" class="small">Agents ↔ ArduPilot SITL: MAVLink / Pymavlink</text>
  <text x="550" y="827" class="small">ArduPilot SITL ↔ Gazebo: simulation integration</text>
</svg>
